<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="audit-expect" content="8:inconsistent-spacing">
<title>Fixture: one row with extra padding</title>
<link rel="stylesheet" href="base.css">
<style>
  .box { max-width: 480px; border: 1px solid #d1d9e0; border-radius: 6px; }
  .box-row { display: flex; gap: 8px; padding: 16px; border-top: 1px solid #d1d9e0; }
  .box-row:first-child { border-top: 0; }
  /* The defect: the last row is padded 24px instead of 16px. */
  .box-row:last-child { padding: 24px; }
</style>
</head>
<body>
<main>
  <div class="box">
    <div class="box-row"><span>Backup script</span></div>
    <div class="box-row"><span>Phone sync</span></div>
    <div class="box-row"><span>Import tool</span></div>
  </div>
</main>
</body>
</html>
