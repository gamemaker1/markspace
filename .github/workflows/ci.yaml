# /.github/workflows/ci.yaml
# GitHub actions workflow to run the tests on each push and pull request, and
# to publish the container images from main and from version tags.

name: CI

on:
  - push
  - pull_request

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7
      - name: Use the Go version from go.mod
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l cmd internal sdk test tools)
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: Run go vet
        run: go vet ./...
  test-go:
    name: Test (Go)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7
      - name: Use the Go version from go.mod
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Run the tests with the race detector
        run: go test -race ./...
  test-client:
    name: Test (Client)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7
      - name: Use Node LTS
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Run the JavaScript client tests
        run: make client
  test-python:
    name: Test (Python)
    strategy:
      matrix:
        python-version: ['3.12', '3.14']
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7
      - name: Use Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run the plugin and SDK tests
        run: make python
  test-fixtures:
    name: Test (Layout audit fixtures)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7
      - name: Use Node LTS
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Install playwright and chromium
        run: |
          npm install --prefix test/browser
          npx --prefix test/browser playwright-core install --with-deps chromium
      - name: Check that every fixture page produces its expected findings
        run: make fixtures
  publish:
    name: Publish (${{ matrix.image }})
    # the fixture results depend on the fonts of the runner, so they do not
    # block publishing
    needs: [lint, test-go, test-client, test-python]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: markspace
            file: containerfile
          - image: markspace-wiki
            file: plugins/wiki/containerfile
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7
      - name: Compute the version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "value=$GITHUB_REF_NAME-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up QEMU to build arm64 images
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to the GitHub container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute the image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          # main gets the tag main, a version tag gets 1.2.3, 1.2 and latest
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - name: Build and push the image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
  release:
    name: Release
    needs: [publish]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create a GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body: |
            Images: `ghcr.io/${{ github.repository_owner }}/markspace:${{ github.ref_name }}` and
            `ghcr.io/${{ github.repository_owner }}/markspace-wiki:${{ github.ref_name }}`.
