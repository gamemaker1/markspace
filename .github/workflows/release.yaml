# /.github/workflows/release.yaml
# GitHub actions workflow to tag a new release.

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: |
          The version to release, such as 1.2.3. The workflow pushes the tag
          v1.2.3, and the CI workflow then publishes the images.
        required: true

jobs:
  tag-release:
    name: Tag Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # a tag pushed with the default token does not start other workflows,
      # so the push uses a personal access token
      - name: Checkout the repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.RELEASE_PAT }}
          fetch-depth: 0
      - name: Configure Git credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - name: Create and push the tag
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "the version must look like 1.2.3, got $VERSION"
            exit 1
          fi
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin "v$VERSION"
