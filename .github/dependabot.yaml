# /.github/dependabot.yaml
# Configures GitHub's Dependabot.

version: 2
updates:
  - package-ecosystem: 'gomod'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      go-dependencies:
        update-types: [minor, patch]
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
  - package-ecosystem: 'docker'
    directories: ['/', '/plugins/wiki', '/sdk/example']
    schedule:
      interval: 'weekly'
  - package-ecosystem: 'npm'
    directory: '/test/browser'
    schedule:
      interval: 'weekly'
